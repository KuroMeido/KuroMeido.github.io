<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuro Hitsuji | Blog</title>
  <meta
    name="description"
    content="Collection of featured articles on C#, architecture, automation, and BIM."
  />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body data-page="blog">
    <header id="site-header" class="site-header">
    </header>

    <main>
        <section class="page-hero">
            <div class="container narrow">
                <p class="section-tag">BLOG</p>
                <h1>Featured Articles</h1>
                <p class="hero-text typewriter" data-type-speed="55" data-type-delay="300">
                    A space for topics about code, construction architecture, urban planning, and BIM workflow.
                </p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="blog-search-wrap">
                    <label for="blog-search" class="blog-search-label">Search posts</label>
                    <input id="blog-search"
                           class="blog-search-input"
                           type="search"
                           placeholder="Search by title, category, or description..."
                           aria-label="Search blog posts" />
                </div>

                <div id="blog-post-list" class="post-grid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>© <span data-current-year>2026</span> KuroHitsuji. Built with GitHub Pages.</p>
        </div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
